<div class="expense-list">
  <!-- Page Header -->
  <header class="page-header">
    <h1>Expenses</h1>
    <p>View, filter, and manage all your expenses</p>
  </header>

  <!-- Filters Section -->
  <div class="filters">
    <div class="filter-group">
      <label for="category-filter">Category</label>
      <select id="category-filter" [(ngModel)]="selectedCategory" (change)="applyFilters()">
        <option value="">All Categories</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Rent">Rent</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="search-input">Search</label>
      <input
        id="search-input"
        type="search"
        placeholder="Search by description..."
        [(ngModel)]="searchText"
        (input)="applyFilters()"
      />
    </div>

    <div class="filter-actions">
      <button class="btn-secondary" (click)="resetFilters()">Reset Filters</button>
    </div>
  </div>

  <!-- Expenses Table -->
  <div class="table-container" *ngIf="filteredExpenses.length > 0">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Category</th>
          <th>Description</th>
          <th>Amount</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let exp of filteredExpenses">
          <td>
            <strong>{{ exp.date }}</strong>
          </td>
          <td>
            <span class="category-badge">{{ exp.category }}</span>
          </td>
          <td>{{ exp.description }}</td>
          <td class="amount-cell">{{ exp.amount | currency }}</td>
          <td>
            <div class="action-buttons">
              <button class="btn-edit btn-sm" (click)="edit(exp.id)">Edit</button>
              <button class="btn-delete btn-sm" (click)="delete(exp.id)">Delete</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="filteredExpenses.length === 0">
    <p>📊 No expenses found. Try adjusting your filters or add a new expense.</p>
  </div>
</div>
